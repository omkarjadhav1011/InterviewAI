{% extends 'base.html' %}
{% block title %}Interview Results — MockMinds{% endblock %}

{% block content %}

<div class="results-wrapper">

  <!-- ── Header ──────────────────────────────────────── -->
  <div class="results-header">
    <div class="emoji-badge">&#127919;</div>
    <h1>Interview Performance</h1>
    <p>Your detailed analysis across all questions</p>
  </div>

  <!-- ── Stat Cards ─────────────────────────────────── -->
  <div class="stats-overview">
    <div class="stat-card">
      <span class="stat-icon">&#128170;</span>
      <div class="stat-value" id="avgConfidence">—</div>
      <div class="stat-label">Confidence</div>
    </div>
    <div class="stat-card">
      <span class="stat-icon">&#129504;</span>
      <div class="stat-value" id="avgTechnical">—</div>
      <div class="stat-label">Technical</div>
    </div>
    <div class="stat-card">
      <span class="stat-icon">&#128172;</span>
      <div class="stat-value" id="avgCommunication">—</div>
      <div class="stat-label">Communication</div>
    </div>
  </div>

  <!-- ── Detailed Breakdown ─────────────────────────── -->
  <div class="results-content">

    <div class="chart-section">
      <h2>Performance Breakdown</h2>
      <div id="minimalChart" class="minimal-chart"></div>
    </div>

    <div class="feedback-section">
      <h2>Question Analysis</h2>
      <div id="resultsList" class="feedback-list"></div>
    </div>

  </div>

  <!-- ── Actions ────────────────────────────────────── -->
  <div class="actions">
    <button class="btn btn-primary" onclick="window.location.href='/interview'">
      <span>&#127908;</span> Retake Interview
    </button>
    <button class="btn btn-secondary" onclick="window.location.href='/'">
      <span>&#127968;</span> Dashboard
    </button>
  </div>

</div>

<script>
  // ─── Results rendering ─────────────────────────────
  // Uses results passed from Flask via Jinja — do NOT rename template variable.
  const results = {{ results|tojson }} || [];

  if (results.length > 0) {
    const toDisplayScore = (v) => {
      if (!v) return 0;
      return v > 10 ? (v / 10) : v;
    };

    // Compute averages
    const avg = (key) =>
      (results.reduce((s, r) => s + toDisplayScore(r.result && r.result[key]), 0) / results.length).toFixed(1);

    document.getElementById('avgConfidence').textContent    = avg('confidence');
    document.getElementById('avgTechnical').textContent     = avg('technical');
    document.getElementById('avgCommunication').textContent = avg('communication');

    const chartDiv    = document.getElementById('minimalChart');
    const feedbackDiv = document.getElementById('resultsList');

    results.forEach((r, i) => {
      const conf  = toDisplayScore(r.result && r.result.confidence)    || 0;
      const tech  = toDisplayScore(r.result && r.result.technical)     || 0;
      const comm  = toDisplayScore(r.result && r.result.communication) || 0;
      const overall = (r.overall_score !== undefined && r.overall_score !== null)
        ? r.overall_score
        : Number(((conf + tech + comm) / 3).toFixed(1));

      // ── Performance bar block ──
      const block = document.createElement('div');
      block.className = 'question-block';
      block.style.animationDelay = (i * 0.06) + 's';
      block.innerHTML = `
        <div class="question-label">Q${i + 1}</div>
        <div class="metrics-bars">
          <div class="metric-row">
            <span class="metric-name">Confidence</span>
            <div class="bar-container">
              <div class="bar bar-confidence" style="width:0%" data-width="${conf * 10}"></div>
            </div>
            <span class="metric-score">${conf}</span>
          </div>
          <div class="metric-row">
            <span class="metric-name">Technical</span>
            <div class="bar-container">
              <div class="bar bar-technical" style="width:0%" data-width="${tech * 10}"></div>
            </div>
            <span class="metric-score">${tech}</span>
          </div>
          <div class="metric-row">
            <span class="metric-name">Communication</span>
            <div class="bar-container">
              <div class="bar bar-communication" style="width:0%" data-width="${comm * 10}"></div>
            </div>
            <span class="metric-score">${comm}</span>
          </div>
        </div>
        <div style="margin-top:12px; color:var(--text-secondary); font-size:0.82rem; font-family:var(--font-mono);">
          ${r.transcript || r.answer ? `"${(r.transcript || r.answer).slice(0,120)}${(r.transcript || r.answer).length > 120 ? '…' : ''}"` : ''}
        </div>
        <div style="margin-top:8px; text-align:right;">
          <span class="overall-score">${overall}/10</span>
        </div>
      `;
      chartDiv.appendChild(block);

      // ── Feedback card ──
      const card = document.createElement('div');
      card.className = 'feedback-card';
      card.style.animationDelay = (i * 0.07 + 0.1) + 's';

      const header = document.createElement('div');
      header.className = 'feedback-header';

      const qnum = document.createElement('span');
      qnum.className = 'question-number';
      qnum.textContent = `Question ${i + 1}`;

      const score = document.createElement('span');
      score.className = 'overall-score';
      score.textContent = `${overall}/10`;

      header.appendChild(qnum);
      header.appendChild(score);

      const txt = document.createElement('p');
      txt.className = 'feedback-text';
      txt.textContent = (r.result && (r.result.feedback || r.result.summary))
        || 'Good effort! Keep practising for smoother delivery.';

      card.appendChild(header);
      card.appendChild(txt);
      feedbackDiv.appendChild(card);
    });

    // Animate bars in after a short delay (allows CSS transition to fire)
    requestAnimationFrame(() => {
      setTimeout(() => {
        document.querySelectorAll('.bar[data-width]').forEach((bar) => {
          bar.style.width = bar.dataset.width + '%';
        });
      }, 120);
    });
  }
</script>

{% endblock %}
